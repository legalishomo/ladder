#asn https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb

[Proxy Group]
cfauto = fallback,CFAUTO,use=true,interval=600,timeout=5,url=http://www.gstatic.com/generate_204
cfus = fallback,CFUS,use=true,interval=600,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=US.*
pqjc-US = fallback,PQJC,use=true,interval=600,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=美国.*-0.*1
pqjc-SG = fallback,PQJC,use=true,interval=600,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=新加坡.*-0.*1
pqjc-JP = fallback,PQJC,use=true,interval=600,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=日本.*-0.*1

